name: Release

# A git tag is only a ref: the entry on the Releases page is a separate API object,
# so tagging alone leaves /releases empty. This workflow creates it from the
# token every Actions run already gets, which means publishing a release needs no
# personal access token anywhere.
#
# Notes for a tag come from docs/release-notes/<tag>.md when that file exists,
# otherwise GitHub generates them from the commits since the previous tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # Only a full version owns a release. `v1` is a moving tag that follows
          # the latest compatible commit, so it must never collect one version's
          # notes - and a release left on it by an earlier run is removed here,
          # while the tag itself is kept (`gh release delete` defaults to keeping
          # the tag, and --cleanup-tag is deliberately not passed).
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "moving/non-version tag '$tag': no release for it"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "removing the release attached to '$tag'"
              gh release delete "$tag" --yes
            fi
            exit 0
          fi

          notes="docs/release-notes/${tag}.md"

          # A draft for this tag may already exist: release-drafter (inherited from upstream)
          # creates one on every push to main and resolves the next version from the last
          # published release. `gh release view` sees drafts, so an existence check alone would
          # answer "already exists" and leave that draft unpublished for ever. Publishing it
          # here is what we want, with the curated notes when there are some.
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "publishing the draft that already exists for $tag"
              if [ -f "$notes" ]; then
                gh release edit "$tag" --draft=false --title "$tag" --notes-file "$notes"
              else
                gh release edit "$tag" --draft=false --title "$tag"
              fi
              exit 0
            fi
            echo "release $tag already published, nothing to do"
            exit 0
          fi

          if [ -f "$notes" ]; then
            echo "using curated notes: $notes"
            gh release create "$tag" --title "$tag" --notes-file "$notes" --verify-tag
          else
            echo "no curated notes, letting GitHub generate them"
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi
